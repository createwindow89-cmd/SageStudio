name: SageStudio Android Build

on:
  push:
    paths:
      - "native-app/**"
      - ".github/workflows/sagestudio-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: native-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SageStudio-debug
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
